<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>SIMPUS-Mini | Daftar Anggota</title>
</head>
<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../indexhtml">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Daftar Anggota</a></li>
                <li><a href="../anggota/list.html">Tambah Anggota</a></li>
            </ul>
        </nav>
    </header>
    
    <main>
        <section>
           <h2>Tambah Buku</h2>
           <from>
            <p>
                <label for="judul">Judul <span style="color:red">* wajib</span></label> <br>
                <input type="text" id="judul" name="judul" required>
            </p>
            <p>
                <label for="pengarang">Pengarang</label> <br>
                <input type="text" id="pengarang" name="pengarang" required>
            </p>
            <p>
                <label for="tahun">Tahun terbit</label> <br>
                <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
            </p>
            <p>
                <label for="isbn">ISBN <span>(optional)</span></label> <br>
                <input type="text" id="isbn" name="isbn" required>
            </p>
            <p>
                <label for="stok">Stok</label> <br>
                <input type="number" id="stok" name="stok" min="0" required>
            </p>
            <p>
                <label for="kategori">Kategori</label><br>
                <select id="kategori" name="kategori">
                    <option value="fiksi">Fiksi</option>
                    <opsion value="non-fiksi">Non-Fiksi</opsion>
                    <opsion value="referensi">Referensi</opsion>
                </select>
            </p>
            <p>
                <button type="submit">Simpan</button>
            </p>
           </from>
    </main>

    <footer>
        <p>&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 1</p>
    </footer>
</body>
</html>
