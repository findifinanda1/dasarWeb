<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Buku</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link" href="../anggota/list.html">Daftar Anggota</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="card-title h3 mb-4 fw-bold" style="color: #1d5b8a;">Tambah Buku</h2>
                
                <form>
                    <div class="mb-3">
                        <label for="judul" class="form-label fw-semibold">Judul <span class="text-danger">* wajib</span></label>
                        <input type="text" class="form-control" id="judul" name="judul" required>
                    </div>

                    <div class="mb-3">
                        <label for="pengarang" class="form-label fw-semibold">Pengarang</label>
                        <input type="text" class="form-control" id="pengarang" name="pengarang" required>
                    </div>

                    <div class="mb-3">
                        <label for="tahun" class="form-label fw-semibold">Tahun Terbit</label>
                        <input type="number" class="form-control" id="tahun" name="tahun" min="1900" max="2026" required>
                    </div>

                    <div class="mb-3">
                        <label for="isbn" class="form-label fw-semibold">ISBN <span class="text-muted fs-7">(opsional)</span></label>
                        <input type="text" class="form-control" id="isbn" name="isbn">
                    </div>

                    <div class="mb-3">
                        <label for="stok" class="form-label fw-semibold">Stok</label>
                        <input type="number" class="form-control" id="stok" name="stok" min="0" required>
                    </div>

                    <div class="mb-4">
                        <label for="kategori" class="form-label fw-semibold">Kategori</label>
                        <select class="form-select" id="kategori" name="kategori">
                            <option value="fiksi">Fiksi</option>
                            <option value="non-fiksi">Non-Fiksi</option>
                            <option value="referensi">Referensi</option>
                        </select>
                    </div>

                    <button type="submit" class="btn text-white px-4" style="background-color: #1d5b8a;">Simpan</button>
                    <a href="list.html" class="btn btn-secondary px-4 ms-2">Batal</a>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 text-muted border-top mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3.1 Bootstrap</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
