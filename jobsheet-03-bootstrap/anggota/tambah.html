<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIMPUS-Mini | Tambah Anggota</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <header class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #1d5b8a;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="../index.html">SIMPUS-Mini</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" aria-controls="navMenu" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navMenu">
                <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" href="../index.html">Beranda</a></li>
                    <li class="nav-item"><a class="nav-link" href="../buku/list.html">Daftar Buku</a></li>
                    <li class="nav-item"><a class="nav-link active" href="list.html">Daftar Anggota</a></li>
                </ul>
            </div>
        </div>
    </header>

    <main class="container my-4">
        <section class="card shadow-sm border-0">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 class="card-title h3 mb-0 fw-bold" style="color: #1d5b8a;">Tambah Anggota</h2>
                    <span class="text-danger fs-7">* wajib diisi</span>
                </div>
                
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="nama" class="form-label fw-semibold">Nama <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="nama" name="nama_lengkap" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label for="no_anggota" class="form-label fw-semibold">No. Anggota <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="no_anggota" name="no_anggota" required>
                    </div>

                    <div class="mb-3">
                        <label for="tanggal_lahir" class="form-label fw-semibold">Tanggal Lahir <span class="text-danger">*</span></label>
                        <input type="date" class="form-control" id="tanggal_lahir" name="tanggal_lahir" required>
                    </div>

                    <div class="mb-3">
                        <label for="alamat" class="form-label fw-semibold">Alamat <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="alamat" rows="4" name="alamat" required></textarea>
                    </div>

                    <div class="mb-4">
                        <label for="no_hp" class="form-label fw-semibold">No. HP <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" id="no_hp" name="no_hp" required>
                    </div>

                    <button type="submit" class="btn text-white px-4" style="background-color: #1d5b8a;">Simpan</button>
                    <a href="list.html" class="btn btn-secondary px-4 ms-2">Batal</a>
                </form>
            </div>
        </section>
    </main>

    <footer class="text-center py-4 text-muted border-top mt-5">
        <div class="container">
            <p class="mb-0">&copy; 2026 SIMPUS-Mini &mdash; Jobsheet 3.1 Bootstrap</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
